<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PASI TOSKA browser</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1118'/%3E%3Cpath d='M7 20c0-5 4-9 9-9s9 4 9 9' fill='none' stroke='%2343e5a0' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='20' r='3' fill='%2343e5a0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#43e5a0"/><stop offset="1" stop-color="#6f8bff"/>
          </linearGradient>
        </defs>
        <path d="M5 22c0-6.1 4.9-11 11-11s11 4.9 11 11" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M10.5 22c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round" opacity=".55"/>
        <circle cx="16" cy="22" r="2.4" fill="#43e5a0"/>
      </svg>
      <h1>PASI TOSKA <span>browser</span></h1>
    </div>
    <div class="top-right">
      <span class="claude" id="claude" hidden></span>
      <div class="node" id="node"><span class="dot"></span><span class="node-ip">…</span></div>
    </div>
  </header>

  <main>
    <section class="launch">
      <div class="picker" id="picker">
        <button class="picker-btn" id="picker-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="picker-value" id="picker-value"></span>
          <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="picker-list" id="picker-list" role="listbox" hidden></ul>
      </div>
      <button class="btn primary" id="launch-btn" type="button" disabled>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4.5v11l9-5.5z" fill="currentColor"/></svg>
        <span>Käynnistä</span>
      </button>
    </section>

    <section class="task" id="task" hidden>
      <form class="task-form" id="task-form">
        <input class="task-input" id="task-input" type="text" placeholder="Tehtävä agentille, ajetaan kaikissa selaimissa" autocomplete="off">
        <button class="tb task-clear" id="task-clear" type="button" title="Tyhjennä" hidden>
          <svg viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="btn primary task-run" id="task-run" type="submit"><span>Aja kaikissa</span></button>
      </form>
      <div class="chips">
        <button class="chip" type="button" data-task="Tutki: mikä on maailman vanhin yhä toimiva ravintola, missä se on ja milloin se perustettiin? Aloita hakukoneesta ja varmista vähintään kahdesta lähteestä.">A · Tutki: maailman vanhin ravintola</button>
        <button class="chip" type="button" data-task="Hae lokakuun tarjoukset kaalimato.com">B · Hae lokakuun tarjoukset kaalimato.com</button>
      </div>
    </section>

    <section class="grid" id="grid"></section>
    <p class="empty" id="empty" hidden>Ei käynnissä olevia selaimia.</p>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <template id="card-tpl">
    <article class="card">
      <header class="card-head">
        <div class="ident">
          <span class="flag"></span>
          <span class="exit-name"></span>
        </div>
        <div class="egress">
          <div class="ip-row"><span class="vdot"></span><span class="ip"></span></div>
          <div class="geo"></div>
        </div>
      </header>

      <div class="screen">
        <iframe title="Selaimen näkymä" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
        <div class="screen-overlay"><div class="spinner"></div><div class="overlay-text"></div></div>
        <div class="replay-view" hidden>
          <video muted playsinline controls></video>
          <button class="tb replay-close" type="button" title="Sulje uusinta">
            <svg viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="bar">
        <button class="tb viewonly on" type="button"></button>
        <div class="spacer"></div>
        <button class="tb iptest" type="button" title="IP-testi">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h14M10 3c2 2.2 3 4.5 3 7s-1 4.8-3 7c-2-2.2-3-4.5-3-7s1-4.8 3-7z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button class="tb fptest" type="button" title="Sormenjälkitesti (botintunnistus)">
          <svg viewBox="0 0 20 20"><path d="M6.5 15.5c.8-1.6 1.2-3.4 1.2-5.3a2.3 2.3 0 014.6 0c0 2.4-.4 4.6-1.3 6.6M4.3 13.2c.4-1 .6-2 .6-3A5.1 5.1 0 0115 8.6M15.3 11.5c-.1 1.6-.5 3.1-1.1 4.5M10 10.2c0 2.4-.6 4.6-1.6 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="tb replay" type="button" title="Uusinta: viimeiset 10 s">
          <svg viewBox="0 0 20 20"><path d="M4 10a6 6 0 106-6H7.5M7.5 4l2-2M7.5 4l2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.6 7.6v4.8l4-2.4z" fill="currentColor"/></svg>
        </button>
        <div class="menu-wrap">
          <button class="tb switch" type="button" title="Vaihda exit lennosta">
            <svg viewBox="0 0 20 20"><path d="M4 7h11M12 4l3 3-3 3M16 13H5M8 10l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="menu" hidden></ul>
        </div>
        <button class="tb fullscreen" type="button" title="Koko näyttö">
          <svg viewBox="0 0 20 20"><path d="M4 8V4h4M16 8V4h-4M4 12v4h4M16 12v4h-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a class="tb newwin" target="_blank" rel="noopener" title="Avaa välilehdessä">
          <svg viewBox="0 0 20 20"><path d="M11 4h5v5M16 4l-7 7M14 12v3.5a.5.5 0 01-.5.5h-9a.5.5 0 01-.5-.5v-9a.5.5 0 01.5-.5H8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button class="tb copy-mcp" type="button">
          <svg viewBox="0 0 20 20"><path d="M8.5 11.5a3 3 0 004.2 0l2.6-2.6a3 3 0 00-4.2-4.2l-1 1M11.5 8.5a3 3 0 00-4.2 0l-2.6 2.6a3 3 0 004.2 4.2l1-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="tb stop" type="button" title="Sulje selain">
          <svg viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="agent" hidden>
        <div class="agent-ask" hidden>
          <span class="ask-reason"></span>
          <button class="btn primary ask-go" type="button">Jatka</button>
        </div>
        <ol class="agent-log"></ol>
        <div class="agent-final"></div>
      </div>
    </article>
  </template>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
